[package]
name = "agent-bridge-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent Bridge SQLite Core schema and transactional migrations"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono.workspace = true
thiserror = "2"
