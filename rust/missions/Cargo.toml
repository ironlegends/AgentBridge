[package]
name = "agent-bridge-missions"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Durable Agent Bridge v7 mission, context, and subtask business logic (caller-owned SQLite connection)"
publish = false

[dependencies]
agent-bridge-core = { path = "../core" }
chrono.workspace = true
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
