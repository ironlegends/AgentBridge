name: CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'full'
      && 'Full native qualification' || 'Economical checks' }} — ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      lane:
        description: Quick feedback or explicit full native release qualification
        required: true
        type: choice
        options: [quick, full]
        default: quick

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'full' && 'qualification' || 'economical' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quick-rust:
    name: Quick Rust checks (Ubuntu, not release qualification)
    needs: hygiene-and-source-archive
    if: needs.hygiene-and-source-archive.outputs.lane == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: quick-v1
      - name: Compile workspace tests (locked)
        run: cargo test --no-run --locked --workspace
      - name: Run portable workspace crates (locked, CLI native tests reserved for full qualification)
        run: cargo test --locked --workspace --exclude agent-bridge

  test-and-build:
    name: Build & Test (${{ matrix.os }})
    needs: hygiene-and-source-archive
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'full' && needs.hygiene-and-source-archive.outputs.lane == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies (Unix)
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2

      - name: Cache both Rust workspaces (Windows)
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Precompile workspace tests for standard Windows test user (locked)
        if: runner.os == 'Windows'
        run: cargo test --no-run --locked --workspace

      - name: Compile native desktop tests (Windows, locked)
        if: runner.os == 'Windows'
        run: cargo test --no-run --locked --manifest-path app/src-tauri/Cargo.toml

      - name: Ensure native X11 test dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v Xvfb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb x11-xkb-utils xfonts-base
          fi

      - name: Inspect system browser prerequisites (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, stat, sys
          candidates = (
              ["/Applications/Google Chrome.app/Contents/MacOS/Google Chrome",
               "/Applications/Chromium.app/Contents/MacOS/Chromium"]
              if sys.platform == "darwin" else
              ["/opt/google/chrome/chrome", "/usr/lib/chromium/chromium",
               "/usr/lib/chromium-browser/chromium-browser"]
          )
          paths = set()
          for candidate in candidates:
              path = pathlib.Path(candidate)
              paths.update([path, *path.parents])
          for path in sorted(paths, key=str):
              try:
                  metadata = path.lstat()
                  print(json.dumps({"path": str(path), "mode": oct(stat.S_IMODE(metadata.st_mode)),
                                    "type": stat.S_IFMT(metadata.st_mode), "uid": metadata.st_uid,
                                    "gid": metadata.st_gid, "nlink": metadata.st_nlink}))
              except OSError as error:
                  print(json.dumps({"path": str(path), "errno": error.errno}))
          PY

      - name: Prepare authenticated native Chrome test fixture (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: |
          fixture_parent="$(mktemp -d /tmp/agent-bridge-browser-fixtures.XXXXXX)"
          sudo -n /usr/bin/python3 -I scripts/rust/prepare-linux-chrome-fixture.py \
            --output-parent "$fixture_parent" >> "$GITHUB_ENV"

      - name: Prepare private native Chrome test fixture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          fixture_parent="$(mktemp -d /tmp/agent-bridge-browser-fixtures.XXXXXX)"
          python3 scripts/rust/prepare-native-chrome-fixture.py \
            --output-parent "$fixture_parent" --github-env "$GITHUB_ENV"

      - name: Run workspace test suite (Unix)
        if: runner.os != 'Windows'
        env:
          AGENT_BRIDGE_REQUIRE_NATIVE_CHROME: "1"
          AGENT_BRIDGE_TEST_CHROME_DIAGNOSTICS: "1"
        run: cargo test --locked --workspace

      - name: Run workspace test suite (Windows, standard non-elevated user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GitHub Actions windows-latest runs elevated (Administrator), whereas
          # agent-bridge-lifecycle intentionally refuses elevated tokens as a
          # fail-closed security invariant. Create an ephemeral standard (non-admin)
          # local user with a real Windows profile (for DPAPI + Known Folders) and
          # execute the full locked test suite under that non-elevated account.
          $ErrorActionPreference = 'Stop'
          $ciUser = 'abci'
          # Random per run. Hex never starts with '/', which net user would read
          # as a switch; the fixed suffix satisfies complexity rules.
          $ciPass = [Convert]::ToHexString([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(16)) + 'a9!'
          Write-Output "::add-mask::$ciPass"
          $ws = (Get-Location).Path
          $logFile = Join-Path $env:RUNNER_TEMP 'ab-win-tests.log'
          $runnerCmd = Join-Path $env:RUNNER_TEMP 'ab-run-tests.cmd'

          & net user $ciUser $ciPass /add /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to create standard CI user" }

          try {
            Set-Service -Name seclogon -StartupType Manual -ErrorAction SilentlyContinue
            Start-Service -Name seclogon -ErrorAction Stop

            $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
            $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }

            # Grant traverse on profile root + read/execute on Cargo/Rustup + modify on workspace & temp
            & icacls "$env:USERPROFILE" /grant "${ciUser}:(X)" /Q | Out-Null
            if (Test-Path $cargoHome) { & icacls "$cargoHome" /grant "${ciUser}:(OI)(CI)M" /T /Q | Out-Null }
            if (Test-Path $rustupHome) { & icacls "$rustupHome" /grant "${ciUser}:(OI)(CI)RX" /T /Q | Out-Null }
            & icacls "$ws" /grant "${ciUser}:(OI)(CI)F" /T /Q | Out-Null
            & icacls "$env:RUNNER_TEMP" /grant "${ciUser}:(OI)(CI)F" /Q | Out-Null

            $cmdContent = @"
          @echo off
          set "CARGO_HOME=$cargoHome"
          set "RUSTUP_HOME=$rustupHome"
          set "PATH=$cargoHome\bin;%PATH%"
          set "CARGO_TERM_COLOR=never"
          cd /d "$ws"
          rem Native Chrome fixtures share the Windows runner; their harness parallelism is not an assertion.
          cargo test --locked --workspace -- --test-threads=1 > "$logFile" 2>&1
          if errorlevel 1 exit /b %ERRORLEVEL%
          cargo test --locked --offline --manifest-path app/src-tauri/Cargo.toml >> "$logFile" 2>&1
          exit /b %ERRORLEVEL%
          "@
            Set-Content -Path $runnerCmd -Value $cmdContent -Encoding Ascii

            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class StandardUserRunner {
              [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern bool CreateProcessWithLogonW(
                  string user, string domain, string password, uint logonFlags,
                  string appName, string cmdLine, uint creationFlags, IntPtr env,
                  string curDir, ref STARTUPINFO si, out PROCESS_INFORMATION pi);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint WaitForSingleObject(IntPtr handle, uint ms);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool GetExitCodeProcess(IntPtr handle, out uint code);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool CloseHandle(IntPtr handle);

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct STARTUPINFO {
                  public int cb;
                  public string lpReserved, lpDesktop, lpTitle;
                  public int dwX, dwY, dwXSize, dwYSize, dwXCountChars, dwYCountChars, dwFillAttribute, dwFlags;
                  public short wShowWindow, cbReserved2;
                  public IntPtr lpReserved2, hStdInput, hStdOutput, hStdError;
              }
              [StructLayout(LayoutKind.Sequential)]
              struct PROCESS_INFORMATION {
                  public IntPtr hProcess, hThread;
                  public uint dwProcessId, dwThreadId;
              }

              public static int Run(string user, string pass, string cmdLine, string cwd) {
                  var si = new STARTUPINFO();
                  si.cb = Marshal.SizeOf(typeof(STARTUPINFO));
                  PROCESS_INFORMATION pi;
                  const uint LOGON_WITH_PROFILE = 0x00000001;
                  const uint CREATE_NO_WINDOW = 0x08000000;
                  if (!CreateProcessWithLogonW(user, ".", pass, LOGON_WITH_PROFILE, null, cmdLine, CREATE_NO_WINDOW, IntPtr.Zero, cwd, ref si, out pi))
                      throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());
                  try {
                      WaitForSingleObject(pi.hProcess, 0xFFFFFFFF);
                      uint code;
                      if (!GetExitCodeProcess(pi.hProcess, out code))
                          throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());
                      return unchecked((int)code);
                  } finally {
                      CloseHandle(pi.hThread);
                      CloseHandle(pi.hProcess);
                  }
              }
          }
          "@

            $exitCode = [StandardUserRunner]::Run($ciUser, $ciPass, "cmd.exe /c `"$runnerCmd`"", $ws)
            if (Test-Path $logFile) { Get-Content -Path $logFile }
            if ($exitCode -ne 0) { exit $exitCode }
          } finally {
            & net user $ciUser /delete /y 2>$null | Out-Null
          }

      - name: Build release CLI binary (locked)
        run: cargo build --locked --release -p agent-bridge

      - name: Build native desktop release (Windows, locked)
        if: runner.os == 'Windows'
        run: cargo build --locked --offline --release --manifest-path app/src-tauri/Cargo.toml

      - name: Compile the standalone source archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source_check_dir="$(mktemp -d)"
          python3 scripts/rust/source-release.py --repo . --out-dir "$source_check_dir"
          python3 - "$source_check_dir" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          archive, = root.glob("*.zip")
          with zipfile.ZipFile(archive) as package:
              package.extractall(root / "source")
          PY
          source_manifest="$(find "$source_check_dir/source" -mindepth 2 -maxdepth 2 -name Cargo.toml)"
          test -n "$source_manifest"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo test --no-run --locked --offline --workspace --manifest-path "$source_manifest"

      - name: Smoke-check CLI version & help
        shell: bash
        run: |
          BIN="target/release/agent-bridge"
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          "$BIN" --version
          "$BIN" --help > /dev/null

  hygiene-and-source-archive:
    name: Open-Source Hygiene & Deterministic Source Archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.scope.outputs.lane }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select validation lane
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_REQUESTED_LANE: ${{ inputs.lane }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/rust/ci_scope.py

      - name: Verify native desktop frontend state transitions
        run: node --test app/tests/live-profile.test.cjs

      - name: Verify Rust comment ratchet
        shell: bash
        env:
          COMMENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s scripts/rust -p 'test_*.py'
          base_ref="${COMMENT_BASE_SHA:-HEAD^1}"
          if [[ "$base_ref" =~ ^0+$ ]]; then base_ref=HEAD^1; fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          python3 scripts/rust/comment_ratchet.py --base-ref "$base_ref"

      - name: Verify clean repository hygiene
        run: python3 scripts/rust/repository_hygiene.py --repo .

      - name: Verify deterministic source-release archive build
        shell: bash
        run: |
          mkdir -p /tmp/agent-bridge-source-check/first /tmp/agent-bridge-source-check/second
          python3 scripts/rust/source-release.py --repo . --out-dir /tmp/agent-bridge-source-check/first
          python3 scripts/rust/source-release.py --repo . --out-dir /tmp/agent-bridge-source-check/second
          cmp /tmp/agent-bridge-source-check/first/*.zip /tmp/agent-bridge-source-check/second/*.zip

  qualification:
    name: Full native qualification (explicit dispatch only)
    needs: [hygiene-and-source-archive, test-and-build]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HYGIENE_RESULT: ${{ needs.hygiene-and-source-archive.result }}
      NATIVE_RESULT: ${{ needs.test-and-build.result }}
      SELECTED_LANE: ${{ needs.hygiene-and-source-archive.outputs.lane }}
      QUALIFIED_SHA: ${{ github.sha }}
    steps:
      - name: Require complete successful native matrix
        shell: bash
        run: |
          test "$SELECTED_LANE" = full
          test "$HYGIENE_RESULT" = success
          test "$NATIVE_RESULT" = success
          printf 'Full native CI qualification passed for commit %s.\n' "$QUALIFIED_SHA" >> "$GITHUB_STEP_SUMMARY"
