[package]
name = "agent-bridge-import"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Explicit read-only-source Task Room snapshot import into Agent Bridge SQLite v7"
publish = false

[dependencies]
chrono.workspace = true
getrandom = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
