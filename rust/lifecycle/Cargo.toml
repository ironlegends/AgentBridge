[package]
name = "agent-bridge-lifecycle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Fail-closed, single-executable portable Agent Bridge lifecycle"

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
fs2 = "0.4"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
] }

# Loader diagnostics are confined to the test build. No debugger code in the
# product, no attach to existing processes and no debug privilege requested.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[features]
# Compiles the tests that need an approved local Low-IL specimen.
low-il-specimen = []
